# Rules for the LLM
parsing_rules:
  - "Samsung models starting with S or A (e.g., S24, A12, S21) should have 'Galaxy' prefix in model (e.g., 'Galaxy S21 Ultra')"
  - "Apple products (iPhone, iPad, MacBook, iMac) should have brand='Apple'"
  - "Google Pixel devices should have brand='Google'"
  - "HP laptops (Elite, ProBook, Pavilion) should have brand='HP' and preserve full model name"
  - "If only brand name is mentioned without model, set model='Unknown'"
  - "Preserve the original product line name (e.g., 'iPhone 15', not just '15')"
  - "Always infer brand from common model names (iPhone → Apple, S21 → Samsung)"
  
# CRITICAL: Device condition and accessories MUST use EXACT strings from API
# These are the ONLY valid values - any variation will be rejected by the server

allowed_conditions:
  - "Dead device"          # dead / won't turn on / not powering on
  - "Cracked Screen"       # broken screen / cracked screen / screen damage
  - "Cracked Back"         # broken back / cracked back / back damage
  
allowed_accessories:
  - "With Bag"            # has bag / came with bag / with bag
  - "With Charger"        # has charger / came with charger / with charger
  - "With Case"           # has case / came with case / with case

# Multiple values should be comma-separated with space after comma
# Example: "Cracked Screen, Dead device, "
# Note: API format includes trailing comma and space

condition_mapping:
  - "dead / won't turn on / not powering on / not turning on → 'Dead device'"
  - "broken screen / cracked screen / screen cracked / screen damage → 'Cracked Screen'"
  - "broken back / cracked back / back cracked / back damage → 'Cracked Back'"
  
accessory_mapping:
  - "with bag / has bag / came with bag → 'With Bag'"
  - "with charger / has charger / came with charger → 'With Charger'"
  - "with case / has case / came with case → 'With Case'"
