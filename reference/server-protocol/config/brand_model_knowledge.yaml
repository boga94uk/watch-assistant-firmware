# Brand/Model Knowledge Base
# This file learns from your corrections and helps the LLM parse device names correctly

# Full extraction examples (with all fields)
full_examples:
  - input: "iPhone 7 broken screen for battery, price 75"
    brand: "Apple"
    model: "iPhone 7"
    problem: "battery replacement"
    deviceCondition: "Cracked Screen, "
    totalPrice: 75.0
    
  - input: "S21 Ultra for charging port"
    brand: "Samsung"
    model: "Galaxy S21 Ultra"
    problem: "charging port repair"
    deviceCondition: null
    totalPrice: null
    
  - input: "book dead iPhone 12 for screen and battery, password 1234, 150 pounds"
    brand: "Apple"
    model: "iPhone 12"
    problem: "screen and battery replacement"
    deviceCondition: "Dead device, "
    devicePassword: "1234"
    totalPrice: 150.0
    
  - input: "dead iPhone 13 cracked back and screen for repair, with case and charger"
    brand: "Apple"
    model: "iPhone 13"
    problem: "screen and back repair"
    deviceCondition: "Dead device, Cracked Screen, Cracked Back, "
    accessories: "With Case, With Charger, "
    totalPrice: null

