[platformio]
default_envs = esp32-s3-n16r8

[env:esp32-s3-n16r8]
platform = espressif32 @ ^6.7.0          ; Arduino-ESP32 3.0.x core
board = esp32-s3-n16r8                    ; Custom board JSON (boards/esp32-s3-n16r8.json)
framework = arduino

; ---- Flash / PSRAM (N16R8: 16MB QSPI Flash + 8MB OPI PSRAM)
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.psram = enabled
board_build.arduino.memory_type = qio_opi    ; QIO flash + OPI PSRAM (CORRECT!)
board_build.arduino.memory_freq = 80m        ; SAFE (40 MHz) - Can try 80m if stable (test first!)

; ---- Partitions ----
board_build.partitions = custom_partitions.csv
board_build.filesystem = spiffs

; ---- USB / Monitor ----
upload_speed = 921600
monitor_speed = 115200
monitor_port = COM6
monitor_dtr = 0
monitor_rts = 0
monitor_filters = esp32_exception_decoder, time, colorize

; ---- Build flags ----
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    -DLV_CONF_INCLUDE_SIMPLE
    -Wno-missing-field-initializers
    -DCONFIG_SPIRAM_USE_MALLOC=1
    ; PSRAM Speed: Uncomment ONE of these (default is 40 MHz if neither specified)
    ; -DCONFIG_SPIRAM_SPEED_40M      ; SAFE: 40 MHz (default, stable on all boards)
    -DCONFIG_SPIRAM_SPEED_80M      ; FAST: 80 MHz (test with psram_stress_test() first!)

build_unflags = -O2

; ---- ESP-IDF sdkconfig (HW crypto re-enabled after LVGL buffer reduction freed DRAM) ----
; board_build.arduino.extra_flags =
;     -DCONFIG_MBEDTLS_HARDWARE_AES=0
;     -DCONFIG_MBEDTLS_HARDWARE_SHA=0
;     -DCONFIG_MBEDTLS_HARDWARE_MPI=0

lib_ldf_mode = deep+
lib_archive = no

; ---- Libraries ----
lib_deps =
    bblanchon/ArduinoJson @ ^7.2.0
